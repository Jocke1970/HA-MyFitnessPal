# HA-MyFitnessPal 0.4.x Lovelace layout prototype - Swedish UI
# Requires: custom:button-card
#
# This file is now intentionally NON-INTERACTIVE.
# button-card intercepts/blocks nested interactive HTML in some HA views, so
# expand/collapse will be implemented in the future HA-MyFitnessPal custom card.
# This YAML is only a visual/data-layout specification.
#
# Nutrition diary:
#   sensor.myfitnesspal_naringsdagbok
# Exercise diary:
#   sensor.ovrigt_myfitnesspal_traningsdagbok

type: vertical-stack
cards:
  # Dagbok - compact visual specification
  - type: custom:button-card
    entity: sensor.myfitnesspal_naringsdagbok
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      header: Dagbok
      diary: >
        [[[
          const entries = Array.isArray(entity?.attributes?.entries) ? entity.attributes.entries : [];
          if (!entries.length) return '<div class="mfp-empty">Ingen mat loggad ännu.</div>';

          const esc = value => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

          const normalizeMeal = value => String(value || 'Other')
            .trim()
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[_-]+/g, ' ')
            .replace(/\s+/g, ' ');

          const mealDefs = [
            { id: 'breakfast', rank: 0, label: 'Frukost', aliases: ['breakfast', 'frukost'] },
            { id: 'lunch', rank: 1, label: 'Lunch', aliases: ['lunch'] },
            { id: 'snacks', rank: 2, label: 'Mellanmål', aliases: ['snacks', 'snack', 'mellanmal'] },
            { id: 'dinner', rank: 3, label: 'Middag', aliases: ['dinner', 'middag'] },
            { id: 'evening_snacks', rank: 4, label: 'Eveningsnacks', aliases: ['eveningsnacks', 'evening snacks', 'evening snack', 'kvallssnacks', 'kvalls snacks', 'kvallssnack'] },
            { id: 'supplements', rank: 5, label: 'Kosttillskott', aliases: ['kosttillskott', 'supplements', 'supplement'] },
          ];

          const mealInfo = raw => {
            const normalized = normalizeMeal(raw);
            const def = mealDefs.find(item => item.aliases.includes(normalized));
            return def
              ? { key: def.id, rank: def.rank, label: def.label }
              : { key: `other:${normalized}`, rank: 100, label: raw || 'Övrigt' };
          };

          const grouped = {};
          for (const item of entries) {
            const info = mealInfo(item?.meal);
            if (!grouped[info.key]) grouped[info.key] = { info, items: [] };
            grouped[info.key].items.push(item);
          }

          const orderedMeals = Object.values(grouped).sort((a, b) =>
            a.info.rank - b.info.rank || a.info.label.localeCompare(b.info.label, 'sv')
          );

          return orderedMeals.map(group => {
            const kcal = group.items.reduce((sum, item) => {
              const value = Number(item?.nutrients?.energy);
              return sum + (Number.isFinite(value) ? value : 0);
            }, 0);

            return `
              <div class="mfp-row">
                <span>${esc(group.info.label)}</span>
                <span class="mfp-row-right">${Math.round(kcal)} kcal <span class="mfp-chevron">›</span></span>
              </div>`;
          }).join('');
        ]]]
    styles:
      card:
        - padding: 20px 22px 22px
        - border-radius: 22px
      grid:
        - grid-template-areas: '"header" "diary"'
        - grid-template-columns: 1fr
        - row-gap: 12px
      custom_fields:
        header:
          - justify-self: start
          - font-size: 20px
          - font-weight: 600
        diary:
          - width: 100%
    extra_styles: |
      .mfp-empty { opacity: .6; padding: 8px 0; }
      .mfp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 15px 16px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.045);
        font-size: 17px;
        font-weight: 600;
      }
      .mfp-row + .mfp-row { margin-top: 10px; }
      .mfp-row-right { white-space: nowrap; }
      .mfp-chevron { margin-left: 7px; opacity: .35; }

  # Träning - compact visual specification
  - type: custom:button-card
    entity: sensor.ovrigt_myfitnesspal_traningsdagbok
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      header: >
        [[[
          const a = entity?.attributes || {};
          const entries = Array.isArray(a.entries) ? a.entries : [];
          const kcal = Number(a.exercise_calories);
          const minutes = Number(a.exercise_duration_minutes);
          const parts = [`${entries.length} pass`];
          if (Number.isFinite(kcal)) parts.push(`${Math.round(kcal)} kcal`);
          if (Number.isFinite(minutes) && minutes > 0) parts.push(`${Math.round(minutes)} min`);
          return `<div class="mfp-training-head"><span>Träning</span><span>${parts.join(' · ')}</span></div>`;
        ]]]
      workouts: >
        [[[
          const entries = Array.isArray(entity?.attributes?.entries) ? entity.attributes.entries : [];
          if (!entries.length) return '<div class="mfp-empty">Ingen träning loggad ännu.</div>';

          const esc = value => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

          const massUnit = hass?.config?.unit_system?.mass || 'kg';
          const showWeight = kg => {
            const value = Number(kg);
            if (!Number.isFinite(value)) return null;
            if (String(massUnit).toLowerCase().startsWith('lb')) {
              return `${Math.round(value * 2.2046226218 * 10) / 10} lb`;
            }
            return `${Math.round(value * 10) / 10} kg`;
          };

          return entries.map(item => {
            const type = String(item?.type || '').toLowerCase();
            const isStrength = type === 'strength';
            const name = esc(item?.name || (isStrength ? 'Styrketräning' : 'Träning'));
            const calories = Number(item?.calories);
            const duration = Number(item?.duration_minutes);
            const sets = Number(item?.sets);
            const reps = Number(item?.reps_per_set);
            const weight = showWeight(item?.weight_kg);

            const parts = [];
            if (isStrength) {
              if (Number.isFinite(sets) && Number.isFinite(reps)) parts.push(`${sets} × ${reps}`);
              if (weight) parts.push(weight);
            } else {
              if (Number.isFinite(duration) && duration > 0) parts.push(`${Math.round(duration)} min`);
              if (Number.isFinite(calories)) parts.push(`${Math.round(calories)} kcal`);
            }

            return `
              <div class="mfp-workout-row">
                <span class="mfp-workout-name">${name}</span>
                <span class="mfp-workout-right">${parts.join(' · ') || 'Detaljer'} <span class="mfp-chevron">›</span></span>
              </div>`;
          }).join('');
        ]]]
    styles:
      card:
        - padding: 20px 22px 22px
        - border-radius: 22px
      grid:
        - grid-template-areas: '"header" "workouts"'
        - grid-template-columns: 1fr
        - row-gap: 12px
      custom_fields:
        header:
          - width: 100%
        workouts:
          - width: 100%
    extra_styles: |
      .mfp-training-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
      }
      .mfp-training-head span:first-child { font-size: 20px; font-weight: 600; }
      .mfp-training-head span:last-child { font-size: 13px; opacity: .55; white-space: nowrap; }
      .mfp-empty { opacity: .6; padding: 8px 0; }
      .mfp-workout-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 15px 16px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.045);
        font-size: 15px;
        font-weight: 600;
      }
      .mfp-workout-row + .mfp-workout-row { margin-top: 10px; }
      .mfp-workout-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mfp-workout-right {
        font-size: 14px;
        font-weight: 500;
        opacity: .72;
        white-space: nowrap;
      }
      .mfp-chevron { margin-left: 7px; opacity: .35; }
