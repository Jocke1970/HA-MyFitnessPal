# HA-MyFitnessPal first-party Lovelace dashboard card
#
# The card JavaScript is bundled with the integration and auto-loaded by
# HA-MyFitnessPal. No custom:button-card dependency or manual Lovelace
# resource is required.
#
# Entity IDs vary between installations and may be localized or renamed.
# Replace the example IDs below with the actual Nutrition diary and
# Exercise diary entities created in your Home Assistant instance.

type: custom:ha-myfitnesspal-card
nutrition_entity: sensor.myfitnesspal_nutrition_diary
exercise_entity: sensor.myfitnesspal_exercise_diary
language: en
show_training: true
show_nutrition_details: true

# Supported card languages:
#   en = English
#   sv = Swedish
# Other Home Assistant locales fall back to English.
