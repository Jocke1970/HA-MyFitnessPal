# MyFitnessPal Lovelace dashboard example - English UI
# Branch: dev
# Requires: custom:button-card
#
# The whole dashboard reads from one entity:
#   sensor.myfitnesspal_naringsdagbok
#
# The Nutrition diary sensor exposes totals, goals, remaining values, diary
# entries and water_ml as attributes. If your entity ID differs, replace only
# that one ID throughout this example.
#
# This card is intentionally read-only.

type: vertical-stack
cards:
  # Calories
  - type: custom:button-card
    entity: sensor.myfitnesspal_naringsdagbok
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      title: Calories
      consumed: >
        [[[
          const a = entity?.attributes || {};
          const totals = a.totals || {};
          const goals = a.goals || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(totals.energy);
          const goal = n(goals.energy);
          const valueText = Number.isFinite(value) ? Math.round(value) : '–';
          const goalText = Number.isFinite(goal) ? Math.round(goal) : '–';
          return `<span class="mfp-main-value">${valueText} kcal</span><span class="mfp-muted"> / ${goalText}</span>`;
        ]]]
      remaining: >
        [[[
          const a = entity?.attributes || {};
          const totals = a.totals || {};
          const goals = a.goals || {};
          const remaining = a.remaining || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(totals.energy);
          const goal = n(goals.energy);
          let rem = n(remaining.energy);
          if (!Number.isFinite(rem) && Number.isFinite(value) && Number.isFinite(goal)) rem = goal - value;
          if (!Number.isFinite(rem)) return '<span class="mfp-muted">– remaining</span>';
          return `<span class="mfp-remaining">${Math.max(0, Math.round(rem))}</span><span class="mfp-muted"> remaining</span>`;
        ]]]
      bar: >
        [[[
          const a = entity?.attributes || {};
          const totals = a.totals || {};
          const goals = a.goals || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(totals.energy);
          const goal = n(goals.energy);
          const pct = Number.isFinite(value) && Number.isFinite(goal) && goal > 0
            ? Math.min(100, Math.max(0, value / goal * 100))
            : 0;
          return `<div class="mfp-track"><div class="mfp-fill mfp-calories" style="width:${pct}%"></div></div>`;
        ]]]
    styles:
      card:
        - padding: 28px 30px 26px
        - border-radius: 28px
      grid:
        - grid-template-areas: '"title title" "consumed remaining" "bar bar"'
        - grid-template-columns: 1fr auto
        - grid-template-rows: auto auto auto
        - row-gap: 18px
      custom_fields:
        title:
          - justify-self: start
          - font-size: 22px
          - font-weight: 500
        consumed:
          - justify-self: start
          - align-self: end
        remaining:
          - justify-self: end
          - align-self: end
        bar:
          - width: 100%
    extra_styles: |
      .mfp-main-value { font-size: 30px; font-weight: 700; }
      .mfp-remaining { font-size: 28px; font-weight: 700; }
      .mfp-muted { font-size: 22px; opacity: 0.42; }
      .mfp-track {
        width: 100%; height: 14px; border-radius: 999px; overflow: hidden;
        background: rgba(0, 0, 0, 0.28);
      }
      .mfp-fill { height: 100%; border-radius: inherit; transition: width .35s ease; }
      .mfp-calories { background: #18bdf2; }

  # Macros
  - type: custom:button-card
    entity: sensor.myfitnesspal_naringsdagbok
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      carbohydrates: >
        [[[
          const a = entity?.attributes || {};
          const totals = a.totals || {};
          const goals = a.goals || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(totals.carbohydrates);
          const goal = n(goals.carbohydrates);
          const pct = Number.isFinite(value) && Number.isFinite(goal) && goal > 0 ? Math.min(100, Math.max(0, value / goal * 100)) : 0;
          const v = Number.isFinite(value) ? Math.round(value) : '–';
          const g = Number.isFinite(goal) ? Math.round(goal) : '–';
          return `<div class="mfp-macro-title">Carbs</div><div class="mfp-macro-value">${v} g <span>/ ${g}</span></div><div class="mfp-track"><div class="mfp-fill mfp-carbs" style="width:${pct}%"></div></div>`;
        ]]]
      fat: >
        [[[
          const a = entity?.attributes || {};
          const totals = a.totals || {};
          const goals = a.goals || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(totals.fat);
          const goal = n(goals.fat);
          const pct = Number.isFinite(value) && Number.isFinite(goal) && goal > 0 ? Math.min(100, Math.max(0, value / goal * 100)) : 0;
          const v = Number.isFinite(value) ? Math.round(value) : '–';
          const g = Number.isFinite(goal) ? Math.round(goal) : '–';
          return `<div class="mfp-macro-title">Fat</div><div class="mfp-macro-value">${v} g <span>/ ${g}</span></div><div class="mfp-track"><div class="mfp-fill mfp-fat" style="width:${pct}%"></div></div>`;
        ]]]
      protein: >
        [[[
          const a = entity?.attributes || {};
          const totals = a.totals || {};
          const goals = a.goals || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(totals.protein);
          const goal = n(goals.protein);
          const pct = Number.isFinite(value) && Number.isFinite(goal) && goal > 0 ? Math.min(100, Math.max(0, value / goal * 100)) : 0;
          const v = Number.isFinite(value) ? Math.round(value) : '–';
          const g = Number.isFinite(goal) ? Math.round(goal) : '–';
          return `<div class="mfp-macro-title">Protein</div><div class="mfp-macro-value">${v} g <span>/ ${g}</span></div><div class="mfp-track"><div class="mfp-fill mfp-protein" style="width:${pct}%"></div></div>`;
        ]]]
    styles:
      card:
        - padding: 26px 28px 28px
        - border-radius: 28px
      grid:
        - grid-template-areas: '"carbohydrates fat protein"'
        - grid-template-columns: repeat(3, 1fr)
        - column-gap: 22px
      custom_fields:
        carbohydrates:
          - text-align: left
        fat:
          - text-align: left
        protein:
          - text-align: left
    extra_styles: |
      .mfp-macro-title { font-size: 21px; margin-bottom: 10px; }
      .mfp-macro-value { font-size: 24px; font-weight: 700; margin-bottom: 22px; white-space: nowrap; }
      .mfp-macro-value span { font-weight: 400; opacity: 0.55; }
      .mfp-track {
        width: 100%; height: 14px; border-radius: 999px; overflow: hidden;
        background: rgba(0, 0, 0, 0.28);
      }
      .mfp-fill { height: 100%; border-radius: inherit; transition: width .35s ease; }
      .mfp-carbs { background: #00c9bd; }
      .mfp-fat { background: #cc62df; }
      .mfp-protein { background: #ffac18; }

  # Water / Fiber / Sugar
  - type: custom:button-card
    entity: sensor.myfitnesspal_naringsdagbok
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      water: >
        [[[
          const a = entity?.attributes || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(a.water_ml);
          const text = Number.isFinite(value) ? `${Math.round(value)} mL` : '–';
          return `<div class="mfp-small-title">Water</div><div class="mfp-small-value">${text}</div>`;
        ]]]
      fiber: >
        [[[
          const a = entity?.attributes || {};
          const totals = a.totals || {};
          const goals = a.goals || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(totals.fiber);
          const goal = n(goals.fiber);
          const v = Number.isFinite(value) ? `${Math.round(value * 10) / 10} g` : '–';
          const g = Number.isFinite(goal) ? ` / ${Math.round(goal)} g` : '';
          return `<div class="mfp-small-title">Fiber</div><div class="mfp-small-value">${v}<span>${g}</span></div>`;
        ]]]
      sugar: >
        [[[
          const a = entity?.attributes || {};
          const totals = a.totals || {};
          const goals = a.goals || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const value = n(totals.sugar);
          const goal = n(goals.sugar);
          const v = Number.isFinite(value) ? `${Math.round(value * 10) / 10} g` : '–';
          const g = Number.isFinite(goal) ? ` / ${Math.round(goal)} g` : '';
          return `<div class="mfp-small-title">Sugar</div><div class="mfp-small-value">${v}<span>${g}</span></div>`;
        ]]]
    styles:
      card:
        - padding: 20px 28px
        - border-radius: 22px
      grid:
        - grid-template-areas: '"water fiber sugar"'
        - grid-template-columns: repeat(3, 1fr)
        - column-gap: 22px
      custom_fields:
        water:
          - text-align: left
        fiber:
          - text-align: left
        sugar:
          - text-align: left
    extra_styles: |
      .mfp-small-title { font-size: 16px; opacity: .72; margin-bottom: 7px; }
      .mfp-small-value { font-size: 20px; font-weight: 700; white-space: nowrap; }
      .mfp-small-value span { font-weight: 400; opacity: .5; }

  # Nutrition details - only values actually supplied by MFP
  - type: custom:button-card
    entity: sensor.myfitnesspal_naringsdagbok
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      header: Nutrition details
      details: >
        [[[
          const totals = entity?.attributes?.totals || {};
          const n = v => (v === null || v === undefined || v === '') ? NaN : Number(v);
          const defs = [
            ['saturated_fat', 'Saturated fat', 'g', 1],
            ['polyunsaturated_fat', 'Polyunsaturated fat', 'g', 1],
            ['monounsaturated_fat', 'Monounsaturated fat', 'g', 1],
            ['trans_fat', 'Trans fat', 'g', 1],
            ['cholesterol', 'Cholesterol', 'mg', 0],
            ['sodium', 'Sodium', 'mg', 0],
            ['potassium', 'Potassium', 'mg', 0],
            ['added_sugars', 'Added sugars', 'g', 1],
          ];
          const rows = defs.flatMap(([key, label, unit, decimals]) => {
            const value = n(totals[key]);
            if (!Number.isFinite(value)) return [];
            const shown = decimals === 0 ? Math.round(value) : Math.round(value * 10) / 10;
            const text = decimals === 0 ? shown.toLocaleString('en-US') : String(shown);
            return [`<div class="mfp-detail-row"><span>${label}</span><b>${text} ${unit}</b></div>`];
          });
          return rows.join('');
        ]]]
    styles:
      card:
        - display: >
            [[[
              const totals = entity?.attributes?.totals || {};
              const keys = ['saturated_fat','polyunsaturated_fat','monounsaturated_fat','trans_fat','cholesterol','sodium','potassium','added_sugars'];
              const hasValue = keys.some(key => {
                const v = totals[key];
                return v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
              });
              return hasValue ? 'block' : 'none';
            ]]]
        - padding: 20px 24px 18px
        - border-radius: 22px
      grid:
        - grid-template-areas: '"header" "details"'
        - grid-template-columns: 1fr
        - row-gap: 10px
      custom_fields:
        header:
          - justify-self: start
          - font-size: 18px
          - font-weight: 600
        details:
          - width: 100%
    extra_styles: |
      .mfp-detail-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 7px 0;
        font-size: 15px;
      }
      .mfp-detail-row + .mfp-detail-row {
        border-top: 1px solid rgba(128, 128, 128, 0.14);
      }
      .mfp-detail-row span { opacity: .72; }
      .mfp-detail-row b { font-weight: 600; white-space: nowrap; }

  # Diary
  - type: custom:button-card
    entity: sensor.myfitnesspal_naringsdagbok
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      header: >
        [[[
          return `<div class="mfp-diary-header">Diary</div>`;
        ]]]
      diary: >
        [[[
          const entries = Array.isArray(entity?.attributes?.entries) ? entity.attributes.entries : [];
          if (!entries.length) return '<div class="mfp-empty">No food logged yet.</div>';

          const normalizeMeal = value => String(value || 'Other')
            .trim()
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[_-]+/g, ' ')
            .replace(/\s+/g, ' ');

          const mealDefs = [
            { id: 'breakfast', rank: 0, label: 'Breakfast', aliases: ['breakfast', 'frukost'] },
            { id: 'lunch', rank: 1, label: 'Lunch', aliases: ['lunch'] },
            { id: 'snacks', rank: 2, label: 'Snacks', aliases: ['snacks', 'snack', 'mellanmal'] },
            { id: 'dinner', rank: 3, label: 'Dinner', aliases: ['dinner', 'middag'] },
            { id: 'evening_snacks', rank: 4, label: 'Evening snacks', aliases: ['eveningsnacks', 'evening snacks', 'evening snack', 'kvallssnacks', 'kvalls snacks', 'kvallssnack'] },
            { id: 'supplements', rank: 5, label: 'Supplements', aliases: ['kosttillskott', 'supplements', 'supplement'] },
          ];

          const mealInfo = raw => {
            const normalized = normalizeMeal(raw);
            const def = mealDefs.find(item => item.aliases.includes(normalized));
            return def
              ? { key: def.id, rank: def.rank, label: def.label }
              : { key: `other:${normalized}`, rank: 100, label: raw || 'Other' };
          };

          const grouped = {};
          for (const item of entries) {
            const info = mealInfo(item?.meal);
            if (!grouped[info.key]) grouped[info.key] = { info, items: [] };
            grouped[info.key].items.push(item);
          }

          const orderedMeals = Object.values(grouped).sort((a, b) =>
            a.info.rank - b.info.rank || a.info.label.localeCompare(b.info.label, 'en')
          );

          return orderedMeals.map(group => {
            const items = group.items;
            const kcal = items.reduce((sum, item) => {
              const value = Number(item?.nutrients?.energy);
              return sum + (Number.isFinite(value) ? value : 0);
            }, 0);

            const foods = items.map(item => {
              const servings = Number(item?.servings);
              const size = item?.serving_size || {};
              const unit = size.unit || '';
              const value = Number(size.value);
              let portion = '';

              if (Number.isFinite(servings) && Number.isFinite(value)) {
                const amount = servings * value;
                const rounded = Number.isInteger(amount) ? amount : Math.round(amount * 10) / 10;
                const translatedUnit = unit === 'piece' ? 'pcs' : unit === 'gram' ? 'g' : unit;
                portion = translatedUnit ? `${rounded} ${translatedUnit}` : `${rounded}`;
              }

              const foodName = item?.food || 'Unknown food';
              return `<div class="mfp-food-row"><span>${foodName}</span><span>${portion}</span></div>`;
            }).join('');

            return `<div class="mfp-meal"><div class="mfp-meal-head"><span>${group.info.label}</span><span>${Math.round(kcal)} kcal</span></div>${foods}</div>`;
          }).join('');
        ]]]
    styles:
      card:
        - padding: 20px 22px 22px
        - border-radius: 22px
      grid:
        - grid-template-areas: '"header" "diary"'
        - grid-template-columns: 1fr
        - row-gap: 12px
      custom_fields:
        header:
          - width: 100%
        diary:
          - width: 100%
    extra_styles: |
      .mfp-diary-header { font-size: 20px; font-weight: 600; }
      .mfp-meal { padding: 15px 16px; border-radius: 15px; background: rgba(255, 255, 255, 0.045); }
      .mfp-meal + .mfp-meal { margin-top: 10px; }
      .mfp-meal-head { display: flex; justify-content: space-between; gap: 12px; font-size: 17px; font-weight: 600; margin-bottom: 9px; }
      .mfp-food-row { display: flex; justify-content: space-between; gap: 14px; font-size: 14px; opacity: .68; padding-top: 4px; }
      .mfp-food-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mfp-food-row span:last-child { white-space: nowrap; }
      .mfp-empty { opacity: .6; padding: 8px 0; }