name: Prepare beta.8 fix

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/prepare-beta8.yml

permissions:
  contents: write

jobs:
  prepare:
    name: Apply beta.8 blocking-call fix
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering dev commit
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Confirm dev has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          if [[ "$(git rev-parse origin/dev)" != "$GITHUB_SHA" ]]; then
            echo "dev moved after this workflow was triggered; refusing to patch stale code" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply beta.8 fix and version wiring
        shell: python
        run: |
          from pathlib import Path

          coordinator = Path("custom_components/myfitnesspal/coordinator.py")
          text = coordinator.read_text(encoding="utf-8")

          start_marker = "    def __init__(self, hass: HomeAssistant, entry: ConfigEntry) -> None:\n"
          fetch_marker = "    def _fetch(self, target_date: date) -> tuple[MyFitnessPalData, str | None]:\n"
          try:
              start = text.index(start_marker)
              end = text.index(fetch_marker, start)
          except ValueError as err:
              raise SystemExit("Could not locate coordinator constructor/fetch boundary") from err

          new_block = (
              "    def __init__(self, hass: HomeAssistant, entry: ConfigEntry) -> None:\n"
              "        self.entry = entry\n"
              "        self._client: MfpClient | None = None\n"
              "\n"
              "        super().__init__(\n"
              "            hass,\n"
              "            _LOGGER,\n"
              "            config_entry=entry,\n"
              "            name=DOMAIN,\n"
              "            update_interval=DEFAULT_UPDATE_INTERVAL,\n"
              "        )\n"
              "\n"
              "    def _create_client(self) -> MfpClient:\n"
              "        \"\"\"Create synchronous mfp-api clients outside the HA event loop.\"\"\"\n"
              "        auth = MfpAuth()\n"
              "        stored_session = MfpSession(\n"
              "            user_token=TokenInfo(\n"
              "                access_token=\"\",\n"
              "                refresh_token=self.entry.data[CONF_REFRESH_TOKEN],\n"
              "                id_token=None,\n"
              "                expires_at=0,\n"
              "            ),\n"
              "            domain_user_id=self.entry.data[CONF_DOMAIN_USER_ID],\n"
              "        )\n"
              "        return MfpClient(stored_session, auth)\n"
              "\n"
              "    async def _async_setup(self) -> None:\n"
              "        \"\"\"Initialize blocking HTTP clients in Home Assistant's executor.\"\"\"\n"
              "        if self._client is None:\n"
              "            self._client = await self.hass.async_add_executor_job(\n"
              "                self._create_client\n"
              "            )\n"
              "\n"
          )
          text = text[:start] + new_block + text[end:]

          old_fetch_body = (
              "        entries = self._client.get_food_diary(target_date)\n"
              "        raw_goals = self._client.get_goals()\n"
          )
          new_fetch_body = (
              "        client = self._client\n"
              "        if client is None:\n"
              "            raise UpdateFailed(\"MyFitnessPal client was not initialized\")\n"
              "\n"
              "        entries = client.get_food_diary(target_date)\n"
              "        raw_goals = client.get_goals()\n"
          )
          if old_fetch_body not in text:
              raise SystemExit("Could not locate coordinator fetch body")
          text = text.replace(old_fetch_body, new_fetch_body, 1)

          replacements = {
              "self._client.get_water(target_date)": "client.get_water(target_date)",
              "self._client.get_exercise_diary(target_date)": "client.get_exercise_diary(target_date)",
              "refresh_token = self._client._session.user_token.refresh_token  # noqa: SLF001": "refresh_token = client._session.user_token.refresh_token  # noqa: SLF001",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Could not locate expected coordinator expression: {old}")
              text = text.replace(old, new, 1)

          old_close = (
              "    def close(self) -> None:\n"
              "        \"\"\"Close HTTP clients.\"\"\"\n"
              "        self._client.close()\n"
          )
          new_close = (
              "    def close(self) -> None:\n"
              "        \"\"\"Close HTTP clients.\"\"\"\n"
              "        if self._client is not None:\n"
              "            self._client.close()\n"
          )
          if old_close not in text:
              raise SystemExit("Could not locate coordinator close method")
          text = text.replace(old_close, new_close, 1)
          coordinator.write_text(text, encoding="utf-8")

          old_version = "0.4.0-beta.7"
          new_version = "0.4.0-beta.8"
          version_files = [
              Path("custom_components/myfitnesspal/manifest.json"),
              Path("custom_components/myfitnesspal/__init__.py"),
              Path("custom_components/myfitnesspal/frontend/ha-myfitnesspal-loader.js"),
              Path("custom_components/myfitnesspal/frontend/ha-myfitnesspal-card.js"),
              Path("README.md"),
          ]
          for path in version_files:
              value = path.read_text(encoding="utf-8")
              if old_version not in value:
                  raise SystemExit(f"Missing {old_version} in {path}")
              path.write_text(value.replace(old_version, new_version), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          value = changelog.read_text(encoding="utf-8")
          heading = "## 0.4.0-beta.8"
          if heading in value:
              raise SystemExit("beta.8 changelog section already exists")
          section = (
              "## 0.4.0-beta.8\n\n"
              "- Move synchronous `mfp-api` HTTP client construction into the coordinator's async setup executor so SSL certificate loading no longer blocks Home Assistant's event loop during integration setup.\n"
              "- Keep normal polling, token refresh handling and config-flow authentication behavior unchanged.\n\n"
          )
          marker = "# Changelog\n\n"
          if marker not in value:
              raise SystemExit("Changelog header not found")
          changelog.write_text(value.replace(marker, marker + section, 1), encoding="utf-8")

      - name: Run local safety checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/myfitnesspal scripts
          python scripts/check_release_version.py
          node --check custom_components/myfitnesspal/frontend/ha-myfitnesspal-loader.js
          node --check custom_components/myfitnesspal/frontend/ha-myfitnesspal-card.js

      - name: Commit clean beta.8 tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-beta8.yml
          git add custom_components/myfitnesspal/coordinator.py \
                  custom_components/myfitnesspal/manifest.json \
                  custom_components/myfitnesspal/__init__.py \
                  custom_components/myfitnesspal/frontend/ha-myfitnesspal-loader.js \
                  custom_components/myfitnesspal/frontend/ha-myfitnesspal-card.js \
                  README.md CHANGELOG.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix blocking client setup and prepare v0.4.0-beta.8"
          git push origin HEAD:dev
