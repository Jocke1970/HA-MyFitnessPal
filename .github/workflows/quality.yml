name: Code quality

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile Python
        run: python -m compileall -q custom_components/myfitnesspal scripts

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.6

      - name: Run Ruff
        run: ruff check custom_components/myfitnesspal scripts --output-format=github

      - name: Validate JSON files
        shell: python
        run: |
          import json
          from pathlib import Path

          files = [Path("hacs.json"), *Path("custom_components/myfitnesspal").rglob("*.json")]
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK: {path}")

  frontend:
    name: Frontend static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check custom_components/myfitnesspal/frontend/ha-myfitnesspal-loader.js
          node --check custom_components/myfitnesspal/frontend/ha-myfitnesspal-card.js

      - name: Run ESLint
        run: npx --yes eslint@10.8.1 custom_components/myfitnesspal/frontend/*.js
