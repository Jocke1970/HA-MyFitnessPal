name: Prepare stable release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare stable candidate
    if: contains(github.event.head_commit.message, '[prepare-stable]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Freeze version wiring at 0.4.0
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"version": "0.4.0-beta.8"' custom_components/myfitnesspal/manifest.json >/dev/null
          sed -i 's/"version": "0.4.0-beta.8"/"version": "0.4.0"/' custom_components/myfitnesspal/manifest.json
          sed -i 's/ha-myfitnesspal-loader.js?v=0.4.0-beta.8/ha-myfitnesspal-loader.js?v=0.4.0/' custom_components/myfitnesspal/__init__.py
          sed -i 's/HA_MFP_LOADER_VERSION = "0.4.0-beta.8"/HA_MFP_LOADER_VERSION = "0.4.0"/' custom_components/myfitnesspal/frontend/ha-myfitnesspal-loader.js
          sed -i 's/HA_MFP_CARD_VERSION = "0.4.0-beta.8"/HA_MFP_CARD_VERSION = "0.4.0"/' custom_components/myfitnesspal/frontend/ha-myfitnesspal-card.js

      - name: Finalize README and changelog
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/As of `0.4.0-beta.8`, the first-party card contains/As of `0.4.0`, the first-party card contains/' README.md
          sed -i 's/Current stable version on `main`: \*\*0.3.0\*\*/Current stable version on `main`: **0.4.0**/' README.md
          sed -i 's/Current development version on `dev`: \*\*0.4.0-beta.8\*\*/Current development version on `dev`: **0.4.0**/' README.md
          sed -i 's/Beta.8 is the final prerelease candidate for 0.4.0. The 0.4.0 line adds read-only exercise diary support, MyFitnessPal-compatible exercise-adjusted goals, the bundled first-party Lovelace card, and event-loop-safe initialization of the MyFitnessPal HTTP clients./Version 0.4.0 is the current stable release. It adds read-only exercise diary support, MyFitnessPal-compatible exercise-adjusted goals, the bundled first-party Lovelace card, event-loop-safe initialization of the MyFitnessPal HTTP clients, and refreshed English-first documentation with Swedish translation support./' README.md
          grep -F '## 0.4.0' CHANGELOG.md >/dev/null && { echo 'Stable changelog section already exists' >&2; exit 1; } || true
          {
            printf '%s\n\n' '# Changelog'
            printf '%s\n\n' '## 0.4.0'
            printf '%s\n' '- Promote the tested 0.4.0 beta line to stable.'
            printf '%s\n' '- Add read-only exercise diary support with separate real-exercise totals and partner calorie-adjustment metadata.'
            printf '%s\n' "- Calculate effective daily calorie and macro goals using MyFitnessPal's exercise-energy allocation settings, including Garmin Connect calorie adjustments."
            printf '%s\n' '- Bundle the first-party HA-MyFitnessPal Lovelace card with expandable diary/exercise details, exercise-adjusted goals, over-goal indicators and Swedish/English UI strings.'
            printf '%s\n' '- Add optional secondary nutrient sensors without increasing MyFitnessPal API traffic.'
            printf '%s\n' "- Keep synchronous MyFitnessPal HTTP client construction and polling outside Home Assistant's event loop."
            printf '%s\n\n' '- Refresh HACS/manual installation documentation, English sensor examples and first-party card screenshots, and remove obsolete legacy YAML dashboard examples.'
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Let release sanity run on main too
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/      - dev/a\      - main' .github/workflows/release-sanity.yml

      - name: Validate stable candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release_version.py
          python -m json.tool custom_components/myfitnesspal/manifest.json >/dev/null
          node --check custom_components/myfitnesspal/frontend/ha-myfitnesspal-loader.js
          node --check custom_components/myfitnesspal/frontend/ha-myfitnesspal-card.js
          grep -F '## 0.4.0' CHANGELOG.md >/dev/null
          grep -F 'Current stable version on `main`: **0.4.0**' README.md >/dev/null
          git diff --check

      - name: Remove one-time workflow and publish candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-stable.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release 0.4.0 stable [publish-stable]'
          git push origin HEAD:dev
