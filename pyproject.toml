[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["SLF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
section-order = [
  "future",
  "standard-library",
  "third-party",
  "home-assistant",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
home-assistant = ["homeassistant"]
